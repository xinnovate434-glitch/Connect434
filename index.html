<style>
:root{--navy:#0B1F4D;--blue:#007BFF;--green:#20B573;--orange:#F59E0B;--ink:#1c2740;--mute:#5b6786;--line:#e3e8f2;--bg:#f4f7fc}
*{box-sizing:border-box}
body{margin:0;font:16px/1.55 'Open Sans',system-ui,sans-serif;color:var(--ink);background:#fff}
h1,h2,h3,.btn,nav a,.brand{font-family:Montserrat,system-ui,sans-serif}
a{color:var(--blue)}
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 5vw;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:2px;color:var(--navy);text-decoration:none}
.brand img{height:42px}
nav{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
nav a{font-size:14px;font-weight:500;color:var(--navy);text-decoration:none}
.btn{display:inline-block;border:0;border-radius:999px;background:var(--blue);color:#fff;font-weight:700;font-size:15px;padding:12px 26px;cursor:pointer;text-decoration:none}
.btn.sm{padding:8px 18px;font-size:14px;background:var(--navy);color:#fff}
.btn.out{background:transparent;border:2px solid #fff;padding:10px 24px}
.btn.ghost{background:#fff;color:var(--blue);border:2px solid var(--blue);padding:10px 24px}
.btn:disabled{opacity:.6}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.hero{background:var(--navy);color:#fff;padding:9vh 5vw 11vh;position:relative}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:8px;background:linear-gradient(90deg,var(--blue),var(--green) 55%,var(--orange))}
.hero .in{max-width:760px}
.eyebrow{color:var(--green);font-weight:600;font-size:14px;margin:0 0 14px}
.hero h1{font-size:clamp(38px,8vw,72px);line-height:1.05;margin:0 0 18px;font-weight:800}
.hero h1 span{color:var(--green)}
.lead{font-size:18px;max-width:520px;color:#d6def0;margin:0 0 26px}
.hero .btn{margin:0 8px 8px 0}
.subjects{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));max-width:980px;margin:-1px auto 0;padding:26px 5vw;gap:10px}
.subj{text-align:center;font-family:Montserrat,sans-serif;font-weight:700;color:var(--navy);font-size:14px}
.subj svg{width:44px;height:44px;fill:none;stroke:var(--navy);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block;margin:0 auto 6px}
section.b{padding:56px 5vw;max-width:1040px;margin:0 auto}
section.b h2{font-size:28px;color:var(--navy);margin:0 0 20px}
.steps{display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;background:var(--bg);border-radius:999px;padding:8px 16px;font-weight:600;font-size:14px;color:var(--navy)}
.steps li::before{content:counter(s) ". ";color:var(--blue)}
.vals{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:22px}
.val{border-left:5px solid var(--c);padding:4px 0 4px 16px}
.val h3{margin:0 0 4px;color:var(--navy);font-size:18px}.val p{margin:0;color:var(--mute)}
footer{background:var(--navy);color:#fff;padding:30px 5vw;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer b{font-family:Montserrat,sans-serif}footer i{color:var(--orange)}
main{background:var(--bg);min-height:70vh;padding:32px 4vw}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px;max-width:760px;margin:0 auto}
.card.narrow{max-width:600px}.card.wide{max-width:1040px}
.card h2{margin:0 0 6px;color:var(--navy)}
.mute{color:var(--mute)}
label{display:block;font-weight:600;font-size:14px;margin-bottom:12px}
input,textarea,select{width:100%;margin-top:4px;padding:10px 12px;border:1px solid #c9d2e4;border-radius:8px;font:inherit;background:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;margin-top:16px}.w{grid-column:1/-1}
fieldset{border:1px solid var(--line);border-radius:8px;margin:0 0 12px}
label.chk{display:flex;gap:10px;align-items:flex-start;font-weight:400}
label.chk input{width:auto;margin-top:5px}
fieldset .chk{display:inline-flex;margin-right:18px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.q{font-size:21px;line-height:1.35}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:14px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--green))}
.status{display:flex;justify-content:space-between;background:var(--bg);border-radius:8px;padding:8px 14px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin:18px 0}
.stat{background:var(--bg);border-radius:10px;padding:12px}.stat b{display:block;font:800 26px Montserrat,sans-serif;color:var(--navy)}
.filters{display:flex;gap:10px;flex-wrap:wrap}.filters input,.filters select{width:auto;flex:1;min-width:150px;margin:0}
.tw{overflow-x:auto;margin-top:14px}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}tr[data-id]{cursor:pointer}tr[data-id]:hover{background:var(--bg)}
td small{display:block;color:var(--mute)}
.pill{padding:3px 10px;border-radius:999px;background:#dbeafe;color:#0b3d91;font-size:12px;font-weight:700;white-space:nowrap}
.pill.approved{background:#d6f5e6;color:#0c6b42}.pill.assessed,.pill.under_review{background:#fdecc8;color:#8a5a00}.pill.not_progressed,.pill.withdrawn{background:#e8eaf0;color:#555}
#detail{margin-top:22px;border-top:3px solid var(--green);padding-top:16px}
.ans{background:var(--bg);border-radius:8px;padding:10px 14px;margin:10px 0}.ans p{margin:6px 0;white-space:pre-wrap}.ans small{color:var(--mute)}
#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,90px);background:var(--navy);color:#fff;padding:12px 20px;border-radius:10px;transition:.25s;z-index:9;max-width:90vw}
#toast.show{transform:translate(-50%,0)}#toast.bad{background:#b3261e}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

const SUPABASE_URL='https://ighzmziswtkgsgctvuhs.supabase.co', SUPABASE_KEY='sb_publishable_1xY9q-j5t9o7WkNWhJg1uQ_t9_FRzti';

const configured=!SUPABASE_URL.startsWith('YOUR')&&window.supabase;
const sb=configured?supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;

async function load(){
  user=null;isStaff=false;cand=null;
  if(configured){
    const {data:{session}}=await sb.auth.getSession();user=session?.user||null;
    if(user){
      isStaff=!!(await sb.from('staff').select('id').eq('id',user.id).maybeSingle()).data;
      cand=(await sb.from('candidates').select('*').eq('user_id',user.id).maybeSingle()).data;
    }
  }
  nav();route();
}
function nav(){
  $('#links').innerHTML='<a href="#/">Home</a>'+(isStaff?'<a href="#/dashboard">Dashboard</a>':user?'<a href="#/assess">My application</a>':'<a href="#/apply">For candidates</a>')+(user?'<a href="#/" id="out">Log out</a>':'<a href="#/login">Login</a><a class="btn sm" href="#/apply">Get started</a>');

}

  ({home,login,apply,assess,dashboard}[r]||home)();
}
addEventListener('hashchange',route);

  app.innerHTML=`<main><section class="card narrow"><h2>Sign in to Connect</h2><p class="mute">Candidates and recruiters use the same login.</p>
<form id="f"><label>Email<input type="email" name="e" required autocomplete="email"></label>
<label>Password (6+ characters)<input type="password" name="p" minlength="6" required autocomplete="current-password"></label>
<div class="row"><button class="btn" data-m="in">Sign in</button><button class="btn ghost" data-m="up">Create account</button></div></form></section></main>`;
  let m='in';app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>m=b.dataset.m);
  $('#f').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),c={email:f.get('e'),password:f.get('p')};
    const {data,error}=m==='in'?await sb.auth.signInWithPassword(c):await sb.auth.signUp(c);
    if(error)return toast(error.message,1);
    if(m==='up'&&!data.session)return toast('Check your email to confirm your account, then sign in.');
    await load();location.hash=isStaff?'#/dashboard':'#/apply';};
}

function apply(){
  if(!user)return location.hash='#/login';
  if(cand)return location.hash='#/assess';
  app.innerHTML=`<main><section class="card"><h2>Apply as a STEM instructor</h2><p class="mute">Takes about 3 minutes. Your assessment starts right after.</p>
<form id="f" class="grid">
<label>Full name<input name="full_name" required></label>
<label>Phone (WhatsApp)<input name="phone" placeholder="+263..." required></label>
<label>Email<input name="email" type="email" value="${esc(user.email)}"></label>
<label>Location<input name="location" required></label>
<label class="w">Education and qualifications<textarea name="education" rows="2" required></textarea></label>
<label class="w">Teaching or technology experience<textarea name="experience" rows="3"></textarea></label>
<label class="w">Availability<input name="availability" placeholder="e.g. Mondays and Fridays"></label>
<fieldset class="w"><legend>Subjects you can teach</legend>${Object.entries(SUBJ).map(([k,v])=>`<label class="chk"><input type="checkbox" name="s" value="${k}">${v}</label>`).join('')}</fieldset>
<label class="chk w"><input type="checkbox" name="consent" required>I agree that Connect may store my details and assessment answers to evaluate my application. Recruiters review every result and make all hiring decisions.</label>
<div class="w"><button class="btn">Submit and start assessment</button></div></form></section></main>`;
  $('#f').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),s=f.getAll('s');
    if(!s.length)return toast('Choose at least one subject.',1);
    const b=e.target.querySelector('button');b.disabled=true;
    const row=Object.fromEntries(['full_name','phone','email','location','education','experience','availability'].map(k=>[k,f.get(k)]));
    const {data:c,error}=await sb.from('candidates').insert({...row,user_id:user.id,consent_given:true,consent_at:new Date().toISOString()}).select().single();
    if(error){b.disabled=false;return toast(error.message,1)}
    const {data:a,error:e2}=await sb.from('applications').insert({candidate_id:c.id}).select().single();
    if(e2){b.disabled=false;return toast(e2.message,1)}
    await sb.from('candidate_subjects').insert(s.map(x=>({candidate_id:c.id,subject:x})));
    await sb.from('assessments').insert(s.map(x=>({application_id:a.id,subject:x})));
    await load();location.hash='#/assess';};
}

async function assess(){
  if(!user)return location.hash='#/login';
  if(!cand)return location.hash='#/apply';
  app.innerHTML='<main><section class="card narrow"><p>Loading...</p></section></main>';
  const {data:a}=await sb.from('applications').select('*').eq('candidate_id',cand.id).order('created_at',{ascending:false}).limit(1).single();
  const {data:as}=await sb.from('assessments').select('*').eq('application_id',a.id);
  const {data:qs}=await sb.from('questions').select('*').eq('active',true).order('sort_order');
  const {data:an}=await sb.from('answers').select('question_id').in('assessment_id',as.map(x=>x.id));
  const done=new Set((an||[]).map(x=>x.question_id)),queue=[];
  as.forEach((x,i)=>qs.filter(q=>q.subject===x.subject||(i===0&&q.subject==='general')).forEach(q=>queue.push({a:x,q})));
  const todo=queue.filter(t=>!done.has(t.q.id)),total=queue.length;
  const head=`<div class="status"><span>Application status</span><b>${ST[a.status]}</b></div>`;
  if(!todo.length){
    app.innerHTML=`<main><section class="card narrow">${head}<h2>${total?'Assessment complete':'No questions yet'}</h2><p>${total?'Thank you. A recruiter will review your results and you will be notified at each step.':'Assessment questions have not been added yet. Please check back soon.'}</p></section></main>`;return;
  }
  const t=todo[0],n=total-todo.length+1;
  app.innerHTML=`<main><section class="card narrow">${head}<div class="bar"><i style="width:${(n-1)/total*100}%"></i></div>
<p class="mute">${t.q.subject==='general'?'General':SUBJ[t.q.subject]}, question ${n} of ${total}</p><h2 class="q">${esc(t.q.prompt)}</h2>
<form id="f"><textarea name="t" rows="8" required placeholder="Type your answer"></textarea><p><button class="btn">${todo.length>1?'Save and continue':'Save and finish'}</button></p></form></section></main>`;
  $('#f').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;
    const {error}=await sb.from('answers').insert({assessment_id:t.a.id,question_id:t.q.id,answer_text:e.target.t.value.trim()});
    if(error){b.disabled=false;return toast(error.message,1)}
    if(todo.length===1){
      await sb.from('assessments').update({status:'completed',completed_at:new Date().toISOString()}).eq('application_id',a.id);
      await sb.from('applications').update({status:'assessed'}).eq('id',a.id);
    }else if(a.status==='registered')await sb.from('applications').update({status:'assessing'}).eq('id',a.id);
    assess();};
}

async function dashboard(){
  if(!isStaff)return location.hash='#/';
  app.innerHTML='<main><section class="card wide"><p>Loading...</p></section></main>';
  const [{data:apps},{data:sc}]=await Promise.all([
    sb.from('applications').select('*,candidates(full_name,phone,email,location,education,experience,availability,candidate_subjects(subject))').order('created_at',{ascending:false}),
    sb.from('application_scores').select('*')]);
  const S=Object.fromEntries((sc||[]).map(x=>[x.application_id,x])),A=apps||[],cnt=k=>A.filter(a=>a.status===k).length;
  app.innerHTML=`<main><section class="card wide"><h2>Recruiter dashboard</h2>
<div class="stats"><div class="stat"><b>${A.length}</b>Applications</div><div class="stat"><b>${cnt('assessed')}</b>Ready to review</div><div class="stat"><b>${cnt('interview')}</b>Interview</div><div class="stat"><b>${cnt('approved')}</b>Approved</div></div>
<div class="filters"><input id="fq" placeholder="Search name or location"><select id="fs"><option value="">All statuses</option>${Object.entries(ST).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div>
<div class="tw"><table><thead><tr><th>Candidate</th><th>Subjects</th><th>Status</th><th>Score</th></tr></thead><tbody id="rows"></tbody></table></div>
<div id="detail"><p class="mute">Select a candidate to review answers and record a decision.</p></div></section></main>`;
  const draw=()=>{const st=$('#fs').value,q=$('#fq').value.toLowerCase();
    const rows=A.filter(a=>(!st||a.status===st)&&(!q||(a.candidates.full_name+' '+a.candidates.location).toLowerCase().includes(q)));
    $('#rows').innerHTML=rows.map(a=>`<tr data-id="${a.id}"><td><b>${esc(a.candidates.full_name)}</b><small>${esc(a.candidates.location)}</small></td><td>${a.candidates.candidate_subjects.map(s=>SUBJ[s.subject]).join(', ')}</td><td><span class="pill ${a.status}">${ST[a.status]}</span></td><td>${S[a.id]?S[a.id].weighted_score+'%':'-'}</td></tr>`).join('')||'<tr><td colspan="4">No applications match.</td></tr>';
    $('#rows').querySelectorAll('tr[data-id]').forEach(r=>r.onclick=()=>detail(A.find(a=>a.id===r.dataset.id),S[r.dataset.id]));};
  $('#fq').oninput=draw;$('#fs').onchange=draw;draw();
}
async function detail(a,s){
  const p=$('#detail'),c=a.candidates;p.innerHTML='<p>Loading...</p>';p.scrollIntoView({behavior:'smooth'});
  const {data}=await sb.from('answers').select('answer_text,questions(prompt,area),evaluations(ai_score,human_score,needs_human_review),assessments!inner(application_id)').eq('assessments.application_id',a.id);
  p.innerHTML=`<h3>${esc(c.full_name)}</h3><p class="mute">${esc(c.phone)}, ${esc(c.email)}, ${esc(c.location)}</p>
<p><b>Qualifications:</b> ${esc(c.education)}</p><p><b>Experience:</b> ${esc(c.experience||'Not given')}</p><p><b>Availability:</b> ${esc(c.availability||'Not given')}</p>
${s?`<p><b>Weighted score:</b> ${s.weighted_score}% <small>${esc(JSON.stringify(s.area_scores))}</small></p>`:'<p class="mute">No AI scores yet. AI scoring arrives in Step 3.</p>'}
${(data||[]).map(x=>{const e=[].concat(x.evaluations||[])[0];return `<div class="ans"><small>${esc(x.questions.area)}</small><br><b>${esc(x.questions.prompt)}</b><p>${esc(x.answer_text)}</p>${e?`<small>AI score ${e.ai_score}${e.needs_human_review?', flagged for human review':''}</small>`:''}</div>`}).join('')}
<label>Decision note<textarea id="dn" rows="3">${esc(a.decision_note||'')}</textarea></label>
<label>Status<select id="ds">${Object.entries(ST).map(([k,v])=>`<option value="${k}"${k===a.status?' selected':''}>${v}</option>`).join('')}</select></label>
<button class="btn" id="sv">Save decision</button>`;
  $('#sv').onclick=async()=>{const {error}=await sb.from('applications').update({status:$('#ds').value,decision_note:$('#dn').value,decided_by:user.id,decided_at:new Date().toISOString()}).eq('id',a.id);
    if(error)return toast(error.message,1);toast('Decision saved.');dashboard();};
}
load();
</script></body></html>
